version: "1.0"
name: full-policy-set
description: A complete policy exercising every schema feature.
rules:
  - id: block-large-payments
    name: Block large payments
    description: Payments over $10,000 require manual approval
    enabled: true
    severity: critical
    action: require_approval
    tools:
      - process_payment
      - schedule_transfer
    conditions:
      - field: arguments.amount
        operator: greater_than
        value: 10000
      - field: arguments.currency
        operator: in
        value: ["USD", "EUR", "GBP"]
    tags:
      - compliance
      - payments
    metadata:
      audit_required: true
      policy_owner: finance-team

  - id: allow-read-operations
    name: Allow read operations
    description: Read-only operations are always allowed
    enabled: true
    severity: info
    action: allow
    agents:
      - analyst-agent
      - support-agent
    tools:
      - get_balance
      - list_transactions

  - id: warn-external-api
    name: Warn on external API calls
    enabled: false
    severity: medium
    action: warn
    conditions:
      - field: arguments.url
        operator: starts_with
        value: "https://external."

  - id: block-regex-match
    name: Block SQL injection patterns
    severity: high
    action: block
    tools:
      - execute_query
    conditions:
      - field: arguments.query
        operator: matches
        value: "(?i)(drop|delete|truncate)\\s+table"

  - id: or-conditions
    name: Block sensitive operations
    severity: high
    action: block
    condition_groups:
      - - field: arguments.action
          operator: equals
          value: delete
      - - field: arguments.scope
          operator: equals
          value: admin
        - field: arguments.confirmed
          operator: not_equals
          value: true

  - id: block-after-secret-read
    name: Block send after secret file read
    severity: high
    action: block
    tools:
      - send_email
    blocked_by:
      - tool: read_file
        conditions:
          - field: arguments.path
            operator: starts_with
            value: "/etc/secrets"

  - id: require-auth-before-transfer
    name: Require verification before transfer
    severity: critical
    action: block
    agents:
      not:
        - internal-auditor
    tools:
      - transfer_funds
    requires:
      - tool: verify_identity
        within: 300
output_rules:
  - id: redact-pii
    name: Redact PII fields
    enabled: true
    severity: high
    action: redact
    tools:
      - get_customer_profile
    output_conditions:
      - field: output.email
        operator: matches
        value: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    redact_with: "[REDACTED_EMAIL]"
settings:
  default_action: allow
  fail_mode: closed
  global_tags:
    - production
