apiVersion: v1
kind: Service
metadata:
  name: {{ include "veto.fullname" . }}-dashboard
  labels:
    app.kubernetes.io/component: dashboard
    {{- include "veto.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.dashboard.type }}
  ports:
    - name: http
      port: {{ .Values.service.dashboard.port }}
      targetPort: 3000
  selector:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
