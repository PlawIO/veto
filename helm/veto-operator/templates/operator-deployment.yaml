apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "veto.fullname" . }}-operator
  labels:
    app.kubernetes.io/component: operator
    {{- include "veto.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.operator }}
  selector:
    matchLabels:
      app.kubernetes.io/component: operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: operator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "veto.fullname" . }}
      containers:
        - name: operator
          image: {{ include "veto.image" .Values.images.operator | quote }}
          imagePullPolicy: {{ .Values.images.operator.pullPolicy }}
          env:
            - name: SELF_HOSTED
              value: "true"
            - name: TELEMETRY_ENABLED
              value: {{ .Values.telemetry.enabled | quote }}
            - name: VETO_LICENSE_SECRET
              value: {{ include "veto.fullname" . }}-license
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
