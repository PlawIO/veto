apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "veto.fullname" . }}-server
  labels:
    app.kubernetes.io/component: server
    {{- include "veto.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.server }}
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "veto.fullname" . }}
      containers:
        - name: server
          image: {{ include "veto.image" .Values.images.server | quote }}
          imagePullPolicy: {{ .Values.images.server.pullPolicy }}
          ports:
            - containerPort: 3001
          env:
            - name: SELF_HOSTED
              value: "true"
            - name: STORAGE_DRIVER
              value: {{ .Values.storage.driver | quote }}
            - name: SQLITE_PATH
              value: {{ .Values.storage.sqlitePath | quote }}
            - name: TELEMETRY_ENABLED
              value: {{ .Values.telemetry.enabled | quote }}
            - name: VETO_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ include "veto.fullname" . }}-license
                  key: license
          volumeMounts:
            - name: data
              mountPath: /var/lib/veto
      volumes:
        - name: data
          {{- if eq .Values.storage.driver "sqlite" }}
          persistentVolumeClaim:
            claimName: {{ include "veto.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
