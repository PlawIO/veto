services:
  veto:
    image: ghcr.io/plawio/veto-server:latest
    ports:
      - "3001:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      SELF_HOSTED: "true"
      STORAGE_DRIVER: "sqlite"
      SQLITE_PATH: "/var/lib/veto/veto.sqlite"
      LICENSE_HEARTBEAT_DISABLED: "true"
    volumes:
      - veto-data:/var/lib/veto

volumes:
  veto-data:
