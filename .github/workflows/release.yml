name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish even without changesets"
        required: false
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  release:
    name: Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Custom version script: runs changeset version + syncs Python SDK version
          # This ensures the "Version Packages" PR includes the pyproject.toml bump
          version: node scripts/version.mjs
          publish: pnpm release
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.VETO_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Auto-approve and enable auto-merge for release PR
        if: steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="$(gh pr list \
            --base master \
            --state open \
            --json number,title,headRefName \
            --jq 'map(select(.title == "chore: release packages" and (.headRefName == "changeset-release/master" or .headRefName == "release/packages-master")))[0].number')"

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open release PR found to auto-merge."
            exit 0
          fi

          gh pr review "$PR_NUMBER" \
            --approve \
            --body "Auto-approving trusted Changesets release PR." || true

          gh pr merge "$PR_NUMBER" \
            --auto \
            --squash \
            --delete-branch

      - name: Publish Python SDK to PyPI
        if: steps.changesets.outputs.published == 'true'
        working-directory: packages/sdk-python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine upload dist/* --non-interactive
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Create GitHub Release for Python
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(grep -m1 'version = ' packages/sdk-python/pyproject.toml | cut -d'"' -f2)
          if git tag | grep -q "sdk-py@$VERSION"; then
            echo "Tag sdk-py@$VERSION already exists, skipping"
          else
            git tag "sdk-py@$VERSION"
            git push origin "sdk-py@$VERSION"
            gh release create "sdk-py@$VERSION" \
              --title "veto-sdk (Python) v$VERSION" \
              --notes "See [CHANGELOG](https://github.com/PlawIO/veto/blob/master/packages/sdk-python/CHANGELOG.md)" \
              --target master
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.VETO_PAT }}

  # Manual release option
  release-manual:
    name: Manual Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Publish npm packages
        run: |
          pnpm --filter veto-sdk publish --no-git-checks --access public || true
          pnpm --filter veto-cli publish --no-git-checks --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Python SDK
        working-directory: packages/sdk-python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine upload dist/* --non-interactive --skip-existing
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
