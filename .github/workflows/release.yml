name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish even without changesets"
        required: false
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check release toolchain
        run: |
          node --version
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          node -e '
            const version = process.argv[1].split(".").map(Number);
            const [major, minor, patch] = version;
            if (
              major < 11 ||
              (major === 11 && minor < 5) ||
              (major === 11 && minor === 5 && patch < 1)
            ) {
              throw new Error(`npm ${process.argv[1]} is too old for trusted publishing; require >=11.5.1`);
            }
          ' "$npm_version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Smoke release artifacts
        run: pnpm smoke:release-artifacts

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Custom version script: runs changeset version + syncs Python SDK version
          # This ensures the "Version Packages" PR includes the pyproject.toml bump
          version: node scripts/version.mjs
          publish: pnpm release
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Auto-approve and enable auto-merge for release PR
        if: steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="$(gh pr list \
            --base master \
            --state open \
            --json number,title,headRefName \
            --jq 'map(select(.title == "chore: release packages" and (.headRefName == "changeset-release/master" or .headRefName == "release/packages-master")))[0].number')"

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open release PR found to auto-merge."
            exit 0
          fi

          gh pr review "$PR_NUMBER" \
            --approve \
            --body "Auto-approving trusted Changesets release PR." || true

          gh pr merge "$PR_NUMBER" \
            --auto \
            --squash \
            --delete-branch

      - name: Build Python SDK distribution
        if: steps.changesets.outputs.published == 'true'
        working-directory: packages/sdk-python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish Python SDK to PyPI
        if: steps.changesets.outputs.published == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist
          skip-existing: true

      - name: Create GitHub Release for Python
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(grep -m1 'version = ' packages/sdk-python/pyproject.toml | cut -d'"' -f2)
          if git tag | grep -q "sdk-py@$VERSION"; then
            echo "Tag sdk-py@$VERSION already exists, skipping"
          else
            git tag "sdk-py@$VERSION"
            git push origin "sdk-py@$VERSION"
            gh release create "sdk-py@$VERSION" \
              --title "veto-sdk (Python) v$VERSION" \
              --notes "See [CHANGELOG](https://github.com/PlawIO/veto/blob/master/packages/sdk-python/CHANGELOG.md)" \
              --target master
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Manual release option
  release-manual:
    name: Manual Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check release toolchain
        run: |
          node --version
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          node -e '
            const version = process.argv[1].split(".").map(Number);
            const [major, minor, patch] = version;
            if (
              major < 11 ||
              (major === 11 && minor < 5) ||
              (major === 11 && minor === 5 && patch < 1)
            ) {
              throw new Error(`npm ${process.argv[1]} is too old for trusted publishing; require >=11.5.1`);
            }
          ' "$npm_version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Smoke release artifacts
        run: pnpm smoke:release-artifacts

      - name: Publish npm packages
        run: |
          publish_if_missing() {
            filter="$1"
            manifest="$2"
            name="$(node -p "require('./${manifest}').name")"
            version="$(node -p "require('./${manifest}').version")"

            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version}; already published."
              return 0
            fi

            pnpm --filter "$filter" publish --no-git-checks --access public --provenance
          }

          publish_if_missing veto-sdk packages/sdk/package.json
          publish_if_missing veto-cli packages/cli/package.json
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Build Python SDK distribution
        working-directory: packages/sdk-python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish Python SDK to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist
          skip-existing: true
