name: Bootstrap receipt package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    if: github.ref == 'refs/heads/master'
    # First publication needs owner authentication before npm can accept OIDC trust.
    # Staging preserves provenance and requires the owner to approve on npm.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Use verified npm staging version
        run: npm install --global npm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter veto-receipt-protocol build
      - run: pnpm --filter veto-receipt-protocol test
      - name: Stage initial receipt package
        working-directory: packages/receipt-protocol
        run: npm stage publish . --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
