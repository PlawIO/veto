[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veto"
version = "0.15.2"
description = "Policy runtime for AI agent tool calls"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    "ai",
    "agent",
    "policy-runtime",
    "tool-calls",
    "runtime-governance",
    "llm",
    "openai",
    "anthropic",
    "gemini"
]
dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.8.0",
    "jsonschema>=4.20.0",
    "pydantic>=2.0.0",
    "sse-starlette>=2.1.3",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
gemini = ["google-genai>=1.0.0"]
otel = ["opentelemetry-api>=1.0.0"]
redis = ["redis>=4.0.0"]
capsule = ["cryptography>=42.0.0", "jcs>=0.2.1", "base58>=2.1.1"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-genai>=1.0.0",
    "opentelemetry-api>=1.0.0",
    "redis>=4.0.0",
    "cryptography>=42.0.0",
    "jcs>=0.2.1",
    "base58>=2.1.1",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.0",
    "cryptography>=42.0.0",
    "jcs>=0.2.1",
    "base58>=2.1.1",
]

[project.scripts]
veto = "veto.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["veto"]

[tool.mypy]
python_version = "3.10"
strict = true
