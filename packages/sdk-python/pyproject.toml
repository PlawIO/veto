[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veto"
version = "0.12.1"
description = "A guardrail system that intercepts and validates AI agent tool calls"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "ai",
    "agent",
    "guardrail",
    "tool-calls",
    "safety",
    "llm",
    "openai",
    "anthropic",
    "gemini"
]
dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.8.0",
    "jsonschema>=4.20.0",
    "pydantic>=2.0.0",
    "sse-starlette>=2.1.3",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
gemini = ["google-genai>=1.0.0"]
otel = ["opentelemetry-api>=1.0.0"]
redis = ["redis>=4.0.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-genai>=1.0.0",
    "opentelemetry-api>=1.0.0",
    "redis>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
veto = "veto.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["veto"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = [
    "agents.guardrail",
    "agents.tool_guardrails",
    "browser_use.agent.views",
    "browser_use.tools.service",
    "crewai.tools",
    "jsonschema",
    "langchain_core.callbacks",
    "langchain_core.messages",
    "opentelemetry",
    "opentelemetry.trace",
    "pydantic_ai",
]
ignore_missing_imports = true
